name: safeguard
description: "SafeGuard SOS App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # 🌐 Internet check (future use)
  connectivity_plus: ^6.0.0

  # 📞 Call & SMS (future use)
  url_launcher: ^6.2.5
  permission_handler: ^11.0.0


  # 📍 Location (future use)
  geolocator: ^11.0.0

  # 🌍 API calling (Twilio backend)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true